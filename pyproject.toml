[project]
name = "rice-arbitrage-agent"
version = "2.0.0"
description = "Multi-Agent Commodity Arbitrage System for Physical Rice Trading"
requires-python = ">=3.11"
dependencies = [
    "langgraph",
    "langchain-core",
    "langchain-google-genai",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv",
    "httpx",
    "beautifulsoup4>=4.12.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "psycopg[binary,pool]>=3.1",
    "langgraph-checkpoint-postgres",
    "sqlalchemy>=2.0",
    "alembic",
    "google-generativeai>=0.4.0",
    "google-api-python-client>=2.100.0",
    "google-auth>=2.23.0",
    "google-auth-oauthlib>=1.1.0",
    "google-auth-httplib2>=0.1.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio",
    "httpx",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
